  - '2.1 Control flow: if, switch, loops, and range-for': week02/lesson01.md
  - 2.2 Functions, overloading and default arguments: week02/lesson02.md
  - 2.3 References, const, and how to pass parameters: week02/lesson03.md
  - 2.4 Scope, lifetime, storage duration and namespaces: week02/lesson04.md
  - 2.5 Enums, structs and attributes: week02/lesson05.md
  - Week quiz: week02/quiz.md
